{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto app-card">
  <div class="bg-white/80 backdrop-blur border border-white/30 rounded-2xl shadow p-8">
    <h1 class="text-2xl font-semibold mb-6">Login</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="text-red-600 text-sm">
          {{ form.non_field_errors }}
        </div>
      {% endif %}

      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input
          type="text"
          name="username"
          required
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input
          type="password"
          name="password"
          required
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700">
        Login
      </button>
    </form>

    <p class="text-sm text-slate-600 mt-6">
      No account?
      <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
