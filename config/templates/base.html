{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Weather Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

<style>
  .theme-default { background-image: linear-gradient(to bottom, #e2e8f0, #f8fafc); }

  .theme-clear   { background-image: url("{% static 'bg/clear.jpg' %}"); }
  .theme-cloudy  { background-image: url("{% static 'bg/cloudy.jpg' %}"); }
  .theme-rain    { background-image: url("{% static 'bg/rain.jpg' %}"); }
  .theme-snow    { background-image: url("{% static 'bg/snow.jpg' %}"); }
  .theme-storm   { background-image: url("{% static 'bg/storm.jpg' %}"); }
  .theme-fog     { background-image: url("{% static 'bg/fog.jpg' %}"); }
  .theme-drizzle { background-image: url("{% static 'bg/drizzle.jpg' %}"); }

  
  .bg-auth {
    background: linear-gradient(
      135deg,
      #3b82f6 0%,
      #6366f1 40%,
      #9333ea 100%
    );
  }

  .bg-home {
    background: linear-gradient(
      135deg,
      #0ea5e9 0%,
      #38bdf8 40%,
      #22d3ee 100%
    );
  }


</style>


</head>

<body class="min-h-screen flex flex-col text-slate-800 bg-cover bg-center {{ body_class|default:'' }}">

<div class="fixed inset-0 bg-black/35 -z-10"></div>







<header class="bg-white/80 backdrop-blur border-b border-white/30">

    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-xl font-bold text-blue-600">
            WeatherApp
        </a>

        <div class="space-x-4">
            {% if user.is_authenticated %}
                <span class="text-sm text-slate-600">
                    Hi, {{ user.username }}
                </span>
                <a href="{% url 'dashboard' %}" class="text-blue-600 hover:underline">
                    Dashboard
                </a>

                <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                   {% csrf_token %}
                   <button type="submit" class="text-red-500 hover:underline">
                     Logout
                   </button>
                </form>

               
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">
                    Login
                </a>
                <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">
                    Register
                </a>
            {% endif %}
        </div>
    </nav>
</header>

<main class="flex-1 max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
</main>

<footer class="bg-white/70 backdrop-blur border-t border-white/30">

    <div class="max-w-6xl mx-auto px-6 py-4 text-sm text-slate-500">
        © 2026 Weather Dashboard UCD Assignment
    </div>
</footer>




 </body>


</html>
