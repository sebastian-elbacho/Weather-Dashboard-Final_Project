<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Weather Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

<header class="bg-white shadow">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-xl font-bold text-blue-600">
            WeatherApp
        </a>

        <div class="space-x-4">
            {% if user.is_authenticated %}
                <span class="text-sm text-slate-600">
                    Hi, {{ user.username }}
                </span>
                <a href="{% url 'dashboard' %}" class="text-blue-600 hover:underline">
                    Dashboard
                </a>
                <a href="{% url 'accounts:logout' %}" class="text-red-500 hover:underline">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">
                    Login
                </a>
                <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">
                    Register
                </a>
            {% endif %}
        </div>
    </nav>
</header>

<main class="flex-1 max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
</main>

<footer class="bg-white border-t">
    <div class="max-w-6xl mx-auto px-6 py-4 text-sm text-slate-500">
        © 2026 Weather Dashboard
    </div>
</footer>

</body>


   

</html>
